<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regalos Sorpresa para Mujeres</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        :root {
            --primary-color: #8b5a83; /* Soft plum/mauve */
            --secondary-color: #d8b4e2; /* Light lavender */
            --accent-color: #e8a598; /* Soft coral/peach */
            --bg-color: #fdfbf7; /* Off-white warm background */
            --text-color: #4a4a4a;
            --box-shadow: 0 10px 25px -5px rgba(139, 90, 131, 0.15), 0 8px 10px -6px rgba(139, 90, 131, 0.1);
        }

        body {
            font-family: 'Lora', serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(216, 180, 226, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(232, 165, 152, 0.1) 0%, transparent 40%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        h1, h2, h3, .font-heading {
            font-family: 'Playfair Display', serif;
        }

        .bg-gradient-primary {
            background: linear-gradient(135deg, var(--primary-color), #a26f96);
        }

        .text-primary-custom {
            color: var(--primary-color);
        }

        .border-primary-custom {
            border-color: var(--primary-color);
        }

        /* Flower decorations */
        .flower-bg {
            position: fixed;
            z-index: -1;
            opacity: 0.15;
            pointer-events: none;
        }
        
        .flower-1 { top: -50px; left: -50px; transform: rotate(45deg); width: 300px; height: 300px; }
        .flower-2 { bottom: -100px; right: -50px; transform: rotate(-30deg); width: 400px; height: 400px; }

        /* Gift Grid */
        .gift-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 1.5rem;
            padding: 1rem;
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Gift Button Styles */
        .gift-box {
            background-color: white;
            border: 2px solid var(--secondary-color);
            border-radius: 1rem;
            padding: 1.5rem 1rem;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            overflow: hidden;
            aspect-ratio: 1;
        }

        .gift-box:hover {
            transform: translateY(-8px) scale(1.05);
            box-shadow: var(--box-shadow);
            border-color: var(--primary-color);
        }

        .gift-box.opened {
            cursor: default;
            transform: scale(0.95);
            opacity: 0.7;
            background-color: #f3f4f6;
            border-color: #d1d5db;
        }

        .gift-box.opened:hover {
            transform: scale(0.95);
            box-shadow: none;
        }

        .gift-number {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
            z-index: 1;
        }

        .gift-icon {
            color: var(--accent-color);
            width: 32px;
            height: 32px;
            z-index: 1;
            transition: transform 0.3s ease;
        }

        .gift-box:hover .gift-icon {
            transform: rotate(15deg) scale(1.1);
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background-color: white;
            border-radius: 1.5rem;
            padding: 2.5rem;
            max-width: 90%;
            width: 500px;
            text-align: center;
            transform: scale(0.9) translateY(20px);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            position: relative;
            overflow: hidden;
            border: 4px solid var(--secondary-color);
        }

        .modal-overlay.active .modal-content {
            transform: scale(1) translateY(0);
            opacity: 1;
        }

        /* Modal Decoration */
        .modal-decor-top {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 40px;
            background-color: var(--primary-color);
            border-radius: 0 0 50px 50px;
            opacity: 0.1;
        }

        .modal-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            cursor: pointer;
            color: #9ca3af;
            transition: color 0.2s;
            background: none;
            border: none;
            padding: 0.5rem;
        }

        .modal-close:hover {
            color: var(--primary-color);
        }

        /* Message Types */
        .verse-text {
            font-size: 1.25rem;
            line-height: 1.8;
            color: var(--text-color);
            margin: 1.5rem 0;
            font-style: italic;
        }

        .verse-reference {
            font-family: 'Playfair Display', serif;
            font-weight: 600;
            color: var(--primary-color);
            font-size: 1.1rem;
            margin-top: 1rem;
        }

        .prize-text {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--primary-color);
            margin: 1.5rem 0;
            line-height: 1.3;
        }

        .prize-icon-container {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 80px;
            height: 80px;
            background-color: #fef3c7; /* light amber */
            border-radius: 50%;
            margin-bottom: 1rem;
            color: #d97706; /* amber */
            animation: pulse 2s infinite;
        }

        .verse-icon-container {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 60px;
            height: 60px;
            background-color: var(--bg-color);
            border: 2px solid var(--secondary-color);
            border-radius: 50%;
            margin-bottom: 1rem;
            color: var(--primary-color);
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(217, 119, 6, 0.4); transform: scale(1); }
            70% { box-shadow: 0 0 0 15px rgba(217, 119, 6, 0); transform: scale(1.05); }
            100% { box-shadow: 0 0 0 0 rgba(217, 119, 6, 0); transform: scale(1); }
        }

        /* Confetti Canvas */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }

        .btn-custom {
            background: linear-gradient(135deg, var(--primary-color), #a26f96);
            color: white;
            padding: 0.75rem 2rem;
            border-radius: 9999px;
            font-family: 'Playfair Display', serif;
            font-weight: 600;
            letter-spacing: 0.05em;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(139, 90, 131, 0.2);
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-custom:hover {
            transform: translateY(-2px);
            box-shadow: var(--box-shadow);
            background: linear-gradient(135deg, #a26f96, var(--primary-color));
        }
        
        .header-ornament {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        
        .ornament-line {
            height: 2px;
            width: 50px;
            background-color: var(--accent-color);
        }

    </style>
</head>
<body class="relative">

    <!-- Background SVG Decorations -->
    <svg class="flower-bg flower-1" viewBox="0 0 100 100" fill="var(--primary-color)">
        <path d="M50,10 C55,30 70,45 90,50 C70,55 55,70 50,90 C45,70 30,55 10,50 C30,45 45,30 50,10 Z"></path>
    </svg>
    <svg class="flower-bg flower-2" viewBox="0 0 100 100" fill="var(--secondary-color)">
        <path d="M50,10 C55,30 70,45 90,50 C70,55 55,70 50,90 C45,70 30,55 10,50 C30,45 45,30 50,10 Z"></path>
    </svg>

    <canvas id="confetti-canvas"></canvas>

    <!-- Header Section -->
    <header class="text-center py-10 px-4 relative z-10">
        <div class="max-w-3xl mx-auto">
            <div class="header-ornament">
                <div class="ornament-line"></div>
                <i data-lucide="gift" class="text-accent-color w-6 h-6" style="color: var(--accent-color);"></i>
                <div class="ornament-line"></div>
            </div>
            <h1 class="text-4xl md:text-5xl font-bold mb-4 text-primary-custom">Tiempo de Sorpresas</h1>
            <p class="text-lg md:text-xl text-gray-600 mb-6 italic">
                "Elige un regalo. La mayoría contiene una palabra de bendición para tu vida, pero uno de ellos esconde una sorpresa especial."
            </p>
            
            <div class="inline-flex items-center gap-2 bg-white px-6 py-3 rounded-full shadow-sm border border-secondary-color">
                <i data-lucide="info" class="w-5 h-5 text-primary-custom"></i>
                <span id="gifts-remaining-text" class="font-medium">Regalos disponibles: <span id="gifts-count" class="font-bold text-primary-custom">30</span></span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow pb-16 px-4 relative z-10">
        <div id="gift-container" class="gift-grid">
            <!-- Gifts will be injected here by JavaScript -->
        </div>

        <div class="text-center mt-12 hidden" id="reset-container">
            <button id="reset-btn" class="btn-custom">
                <i data-lucide="refresh-cw" class="w-5 h-5"></i>
                Reiniciar Actividad
            </button>
        </div>
    </main>

    <!-- Result Modal -->
    <div id="result-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-decor-top"></div>
            <button class="modal-close" id="close-modal" aria-label="Cerrar">
                <i data-lucide="x" class="w-6 h-6"></i>
            </button>
            
            <div id="modal-body">
                <!-- Content injected by JS -->
            </div>
            
            <div class="mt-8">
                <button class="btn-custom w-full" id="continue-btn">
                    Continuar
                </button>
            </div>
        </div>
    </div>

    <script>
        // Data: 30 beautiful bible verses for women
        const verses = [
            { text: "Engañosa es la gracia, y vana la hermosura; La mujer que teme a Jehová, ésa será alabada.", ref: "Proverbios 31:30" },
            { text: "Fuerza y honor son su vestidura; Y se ríe de lo por venir.", ref: "Proverbios 31:25" },
            { text: "Dios está en medio de ella; no será conmovida. Dios la ayudará al clarear la mañana.", ref: "Salmo 46:5" },
            { text: "Abre su boca con sabiduría, Y la ley de clemencia está en su lengua.", ref: "Proverbios 31:26" },
            { text: "Reconócelo en todos tus caminos, Y él enderezará tus veredas.", ref: "Proverbios 3:6" },
            { text: "Mira que te mando que te esfuerces y seas valiente; no temas ni desmayes, porque Jehová tu Dios estará contigo en dondequiera que vayas.", ref: "Josué 1:9" },
            { text: "Por nada estéis afanosos, sino sean conocidas vuestras peticiones delante de Dios en toda oración y ruego, con acción de gracias.", ref: "Filipenses 4:6" },
            { text: "Jehová es mi fortaleza y mi escudo; En él confió mi corazón, y fui ayudado.", ref: "Salmo 28:7" },
            { text: "Todo lo puedo en Cristo que me fortalece.", ref: "Filipenses 4:13" },
            { text: "Mas los que esperan a Jehová tendrán nuevas fuerzas; levantarán alas como las águilas; correrán, y no se cansarán; caminarán, y no se fatigarán.", ref: "Isaías 40:31" },
            { text: "Porque yo sé los pensamientos que tengo acerca de vosotros, dice Jehová, pensamientos de paz, y no de mal, para daros el fin que esperáis.", ref: "Jeremías 29:11" },
            { text: "El amor es sufrido, es benigno; el amor no tiene envidia, el amor no es jactancioso, no se envanece.", ref: "1 Corintios 13:4" },
            { text: "Amadas, amémonos unos a otros; porque el amor es de Dios. Todo aquel que ama, es nacido de Dios, y conoce a Dios.", ref: "1 Juan 4:7" },
            { text: "Echa sobre Jehová tu carga, y él te sustentará; No dejará para siempre caído al justo.", ref: "Salmo 55:22" },
            { text: "Pero el Señor estuvo a mi lado, y me dio fuerzas.", ref: "2 Timoteo 4:17" },
            { text: "La mujer sabia edifica su casa; Mas la necia con sus manos la derriba.", ref: "Proverbios 14:1" },
            { text: "Bendito el varón (y la mujer) que confía en Jehová, y cuya confianza es Jehová.", ref: "Jeremías 17:7" },
            { text: "Con amor eterno te he amado; por tanto, te prolongué mi misericordia.", ref: "Jeremías 31:3" },
            { text: "Confía en Jehová con todo tu corazón, Y no te apoyes en tu propia prudencia.", ref: "Proverbios 3:5" },
            { text: "El Señor es mi luz y mi salvación; ¿de quién temeré? El Señor es la fortaleza de mi vida; ¿de quién he de atemorizarme?", ref: "Salmo 27:1" },
            { text: "Vuestro atavío no sea el externo... sino el interno, el del corazón, en el incorruptible ornato de un espíritu afable y apacible, que es de grande estima delante de Dios.", ref: "1 Pedro 3:3-4" },
            { text: "Y la paz de Dios, que sobrepasa todo entendimiento, guardará vuestros corazones y vuestros pensamientos en Cristo Jesús.", ref: "Filipenses 4:7" },
            { text: "Jehová te bendiga, y te guarde; Jehová haga resplandecer su rostro sobre ti, y tenga de ti misericordia.", ref: "Números 6:24-25" },
            { text: "Porque somos hechura suya, creados en Cristo Jesús para buenas obras, las cuales Dios preparó de antemano para que anduviésemos en ellas.", ref: "Efesios 2:10" },
            { text: "He aquí que yo te he purificado, y no como a plata; te he escogido en horno de aflicción.", ref: "Isaías 48:10" },
            { text: "Tú eres mi refugio; me guardarás de la angustia; Con cánticos de liberación me rodearás.", ref: "Salmo 32:7" },
            { text: "Bástate mi gracia; porque mi poder se perfecciona en la debilidad.", ref: "2 Corintios 12:9" },
            { text: "Porque irrevocables son los dones y el llamamiento de Dios.", ref: "Romanos 11:29" },
            { text: "Cercano está Jehová a los quebrantados de corazón; Y salva a los contritos de espíritu.", ref: "Salmo 34:18" },
        { text: "Bienaventurada la que creyó, porque se cumplirá lo que le fue dicho de parte del Señor.", ref: "Lucas 1:45" }
    ];

    const TOTAL_GIFTS_TO_SHOW = 30;
    let availableNumbers = [];
    let winningNumber = null;
    let giftsState = {}; // Keep track of opened gifts
    let remainingCount = TOTAL_GIFTS_TO_SHOW;

    // DOM Elements
    const giftContainer = document.getElementById('gift-container');
        const modal = document.getElementById('result-modal');
        const modalBody = document.getElementById('modal-body');
        const closeModalBtn = document.getElementById('close-modal');
        const continueBtn = document.getElementById('continue-btn');
        const giftsCountSpan = document.getElementById('gifts-count');
        const resetContainer = document.getElementById('reset-container');
    const resetBtn = document.getElementById('reset-btn');

    function initGame() {
        // Reset state
        giftContainer.innerHTML = '';
        giftsState = {};
        remainingCount = TOTAL_GIFTS_TO_SHOW;
        updateCounter();
        resetContainer.classList.add('hidden');

        // Generate 20 sequential numbers from 1 to 20
        availableNumbers = Array.from({length: TOTAL_GIFTS_TO_SHOW}, (_, i) => i + 1);

        // Pick ONE winning number from the 20 gifts
        const winningIndex = Math.floor(Math.random() * availableNumbers.length);
        winningNumber = availableNumbers[winningIndex];

        // Render gifts
        availableNumbers.forEach(num => {
            giftsState[num] = { opened: false };
            createGiftElement(num);
        });

        // Re-initialize icons for newly added elements
        lucide.createIcons();
    }

    function createGiftElement(number) {
            const giftDiv = document.createElement('div');
            giftDiv.className = 'gift-box group';
            giftDiv.id = `gift-${number}`;
            
            giftDiv.innerHTML = `
                <div class="gift-number">${number}</div>
                <i data-lucide="gift" class="gift-icon"></i>
            `;

            giftDiv.addEventListener('click', () => handleGiftClick(number, giftDiv));
            giftContainer.appendChild(giftDiv);
        }

        function handleGiftClick(number, element) {
            if (giftsState[number].opened) return;

            // Mark as opened
            giftsState[number].opened = true;
            element.classList.add('opened');
            
            // Change icon to an open box or checkmark
            const iconElement = element.querySelector('.gift-icon');
            iconElement.setAttribute('data-lucide', 'check-circle');
            iconElement.classList.replace('text-accent-color', 'text-gray-400');
            lucide.createIcons();

            // Update counter
            remainingCount--;
            updateCounter();

            // Check if it's the winner
            if (number === winningNumber) {
                showWinnerModal(number);
                endGame();
            } else {
                showVerseModal(number);
            }

            if (remainingCount === 0 && number !== winningNumber) {
                endGame();
            }
        }

        function updateCounter() {
            giftsCountSpan.textContent = remainingCount;
        }

        function showWinnerModal(number) {
            modalBody.innerHTML = `
                <div class="prize-icon-container">
                    <i data-lucide="award" class="w-10 h-10"></i>
                </div>
                <h2 class="font-heading text-3xl font-bold text-gray-800 mb-2">¡Felicidades!</h2>
                <p class="text-gray-500 mb-4">Elegiste el número ${number}</p>
                <div class="prize-text">
                    ¡HAS ENCONTRADO EL REGALO SORPRESA!
                </div>
                <p class="text-lg text-gray-600 mt-4">
                    Acércate para reclamar tu premio especial. ¡Eres una mujer bendecida!
                </p>
            `;
            
            lucide.createIcons();
            openModal();
            triggerConfetti();
        }

        function showVerseModal(number) {
            // Get a random verse (we can use the number as seed or just pick random)
            // To ensure variety, pick random from array
            const randomVerseIndex = Math.floor(Math.random() * verses.length);
            const verse = verses[randomVerseIndex];

            modalBody.innerHTML = `
                <div class="verse-icon-container">
                    <i data-lucide="heart" class="w-8 h-8"></i>
                </div>
                <h2 class="font-heading text-2xl font-bold text-gray-800">Un mensaje para ti</h2>
                <p class="text-gray-400 text-sm mb-2">Regalo #${number}</p>
                
                <div class="verse-text">
                    "${verse.text}"
                </div>
                <div class="verse-reference">
                    — ${verse.ref}
                </div>
            `;
            
            lucide.createIcons();
            openModal();
        }

        function openModal() {
            modal.classList.add('active');
        }

        function closeModal() {
            modal.classList.remove('active');
        }

        function endGame() {
            // Disable all remaining gifts
            availableNumbers.forEach(num => {
                if (!giftsState[num].opened) {
                    const el = document.getElementById(`gift-${num}`);
                    el.classList.add('opened');
                    el.style.opacity = '0.5';
                    giftsState[num].opened = true;
                }
            });
            resetContainer.classList.remove('hidden');
        }

        // Confetti Effect
        function triggerConfetti() {
            var duration = 3000;
            var end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 5,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: ['#8b5a83', '#d8b4e2', '#e8a598', '#fef3c7']
                });
                confetti({
                    particleCount: 5,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: ['#8b5a83', '#d8b4e2', '#e8a598', '#fef3c7']
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        }

        // Event Listeners
        closeModalBtn.addEventListener('click', closeModal);
        continueBtn.addEventListener('click', closeModal);
        resetBtn.addEventListener('click', initGame);

        // Close modal when clicking outside
        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                closeModal();
            }
        });

        // Initialize the app on load
        window.addEventListener('DOMContentLoaded', initGame);

    </script>
</body>
</html>
